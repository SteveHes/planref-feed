name: Daily source check
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the daily check
        run: python3 scripts/daily_check.py
      - name: Commit the updated stamp
        run: |
          git config user.name  "planref-daily-check"
          git config user.email "actions@users.noreply.github.com"
          git add changes.json candidates.json
          git diff --cached --quiet || git commit -m "Daily source check: $(date -u +%F)"
          git push
